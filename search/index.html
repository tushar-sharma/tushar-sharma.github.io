---
layout: default
title: Search
---

<link rel="stylesheet" href="{{ root_url }}/css/pagefind-search.css" />

<div class="container pagefind-search">
  <article>
    <h1>Search</h1>
    <form id="pagefind-search-form" class="pagefind-search__form" role="search">
      <label class="pagefind-search__label" for="pagefind-search-input">Search posts</label>
      <div class="pagefind-search__controls">
        <input id="pagefind-search-input" name="q" type="search"
          placeholder="Try a topic, phrase, or function name"
          autocomplete="off" autocapitalize="none" spellcheck="false"
          aria-describedby="pagefind-search-hint pagefind-search-status" />
        <button type="submit" aria-label="Search">Search</button>
      </div>
      <fieldset class="pagefind-search__modes" aria-label="Search mode">
        <legend>Search mode</legend>
        <label>
          <input type="radio" name="mode" value="keyword" checked />
          <span>Keyword</span>
        </label>
        <label>
          <input type="radio" name="mode" value="fuzzy" />
          <span>Fuzzy</span>
        </label>
      </fieldset>
      <p id="pagefind-search-hint" class="pagefind-search__hint">
        Press <kbd>/</kbd> to focus. Results stay on this device.
      </p>
    </form>
    <p id="pagefind-search-status" class="pagefind-search__status" role="status" aria-live="polite"></p>
    <div id="pagefind-search-results" class="pagefind-search__results" aria-live="off"></div>
    <nav id="pagefind-search-pagination" class="pagefind-search__pagination"
      aria-label="Search result pages" hidden></nav>
  </article>
</div>

<script type="module" src="{{ root_url }}/js/pagefind-search.js"></script>
